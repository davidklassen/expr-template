name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz FuzzParse -fuzztime 10m .
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failure
          path: testdata/fuzz

  expr-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go get github.com/expr-lang/expr@master
      - run: go test ./...
